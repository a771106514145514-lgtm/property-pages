(function(){
  var imgs=[].slice.call(document.querySelectorAll('.gal img'));
  var th=[].slice.call(document.querySelectorAll('.thumbs img'));
  var cur=0, label=document.querySelector('.gal .count');
  if(!imgs.length) return;
  function show(i){
    cur=(i+imgs.length)%imgs.length;
    imgs.forEach(function(el,n){el.classList.toggle('on',n===cur)});
    th.forEach(function(el,n){el.classList.toggle('on',n===cur)});
    if(label) label.textContent=(cur+1)+' / '+imgs.length;
  }
  var p=document.querySelector('.gal .prev'), n=document.querySelector('.gal .next');
  if(p) p.onclick=function(){show(cur-1)};
  if(n) n.onclick=function(){show(cur+1)};
  th.forEach(function(el,i){el.onclick=function(){show(i)}});
  show(0);
})();
